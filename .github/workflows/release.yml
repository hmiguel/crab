name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
            bundle_dir: target/universal-apple-darwin/release/bundle
          - os: windows-latest
            rust_targets: ""
            tauri_args: ""
            bundle_dir: target/release/bundle
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      - name: Check that the tag matches the app version
        if: github.ref_type == 'tag'
        run: node scripts/version.mjs check ${{ github.ref_name }}

      - name: Regenerate third-party license notices for this platform
        run: pnpm notices

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # WiX (.msi) rejects pre-release versions like 0.2.0-beta.1, so betas ship the NSIS installer only.
          args: ${{ matrix.tauri_args }} ${{ matrix.os == 'windows-latest' && contains(github.ref_name, '-') && '--bundles nsis' || '' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Crab ${{ github.ref_name }}"
          releaseBody: |
            See [CHANGELOG.md](https://github.com/hmiguel/crab/blob/main/CHANGELOG.md) for what's new.

            **macOS** (Apple Silicon and Intel): download the `.dmg` and drag Crab to Applications. Builds are not signed. To allow the first launch, open Crab, then go to **System Settings → Privacy & Security → Open Anyway** (on macOS 14 and earlier, right-click the app and choose **Open**), or run `xattr -dr com.apple.quarantine /Applications/Crab.app`.

            **Windows**: download the `-setup.exe` (stable releases also include an `.msi`). SmartScreen will warn about the unsigned installer; choose **More info → Run anyway**.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - uses: actions/upload-artifact@v4
        with:
          name: crab-${{ matrix.os }}
          path: |
            ${{ matrix.bundle_dir }}/dmg/*.dmg
            ${{ matrix.bundle_dir }}/msi/*.msi
            ${{ matrix.bundle_dir }}/nsis/*.exe
          if-no-files-found: error

  # Publish the draft once every platform has uploaded its installers.
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
