[package]
name = "crab-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Parser, variable resolver and HTTP executor for .http files"

[dependencies]
base64 = "0.22"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", features = ["gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
wiremock = "0.6"
